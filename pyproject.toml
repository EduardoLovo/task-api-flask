[project]
name = "task-api-flask"
version = "1.0.0"
description = "API REST de gerenciamento de tarefas com autenticação JWT e tratamento padronizado de erros (Python + Flask)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "pydantic>=2.13.5",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "waitress>=3.0.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["app/docs/swagger_ui"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle (erros e avisos de estilo)
    "F",       # pyflakes (imports e variáveis sem uso, nomes indefinidos)
    "I",       # ordem dos imports
    "B",       # bugbear (armadilhas comuns de Python)
    "UP",      # pyupgrade (sintaxe moderna para a versão mínima suportada)
    "SIM",     # simplificações
    "S",       # bandit (problemas de segurança)
]

[tool.ruff.lint.per-file-ignores]
# Nos testes, assert é o normal e os "segredos" são valores fixos de teste.
"tests/**" = ["S101", "S105", "S106"]
